<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Moines Eclipse Stat Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-mode.js"></script>
    <script src="config.js"></script>
    <script src="offline-storage.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap');

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-card: #3a3a3a;
            --accent-primary: #dc2626;
            --accent-secondary: #ef4444;
            --accent-green: #10b981;
            --accent-red: #dc2626;
            --text-primary: #f5f5f5;
            --text-secondary: #9ca3af;
            --border: #525252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow Condensed', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        .app-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        .app-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            margin-bottom: 10px;
            animation: titleSlide 0.8s ease-out;
        }

        @keyframes titleSlide {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .match-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .set-indicator {
            display: inline-flex;
            gap: 10px;
            background: var(--bg-secondary);
            padding: 10px 20px;
            border-radius: 8px;
            border: 2px solid var(--border);
        }

        .set-badge {
            padding: 5px 15px;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            border: 2px solid transparent;
        }

        .set-badge.active {
            background: var(--accent-primary);
            border-color: var(--accent-primary);
            transform: scale(1.1);
        }

        .set-badge:not(.active) {
            background: var(--bg-card);
            opacity: 0.6;
        }

        .set-badge:not(.active):hover {
            opacity: 1;
            border-color: var(--accent-secondary);
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            animation: fadeIn 0.6s ease-out 0.2s both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            border: 2px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .section-title {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
            color: var(--accent-primary);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .undo-btn {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.5rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .undo-btn:hover:not(:disabled) {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
            transform: scale(1.05);
        }

        .undo-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .undo-btn-text {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .score-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .team-card {
            background: var(--bg-card);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid var(--border);
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: var(--accent-primary);
            transform: translateX(5px);
        }

        .team-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .team-name-static {
            font-family: 'Oswald', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px;
        }

        .team-score {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            text-shadow: 0 0 20px rgba(220, 38, 38, 0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .scoring-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .score-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .score-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .score-btn:active::before {
            width: 300px;
            height: 300px;
        }

        .score-btn.kill { background: var(--accent-green); color: white; }
        .score-btn.block { background: #6b7280; color: white; }
        .score-btn.serve { background: var(--accent-secondary); color: white; }
        .score-btn.error { background: #991b1b; color: white; }

        .score-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .score-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .stat-item {
            background: var(--bg-secondary);
            padding: 8px;
            border-radius: 5px;
            text-align: center;
            border: 1px solid var(--border);
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            color: var(--accent-primary);
        }

        .set-controls {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-controls-top {
            display: flex;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .save-set-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 12px 30px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .save-set-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.5);
        }

        .set-history {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .set-score {
            background: var(--bg-card);
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            border: 2px solid var(--border);
            letter-spacing: 0.5px;
        }

        .player-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        .player-card {
            position: relative;
            display: flex;
            gap: 8px;
            min-height: 48px;
        }

        .player-btn {
            font-family: 'Oswald', sans-serif;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .player-btn:hover {
            border-color: var(--accent-primary);
            transform: scale(1.02);
        }

        .stats-sub-header {
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            margin-top: 20px;
            margin-bottom: 10px;
            padding-left: 4px;
        }

        /* Player Action Modal */
        .player-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.25s ease-out;
        }

        .player-modal {
            background: var(--bg-secondary);
            border: 3px solid var(--accent-primary);
            border-radius: 15px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            position: relative;
            overflow: hidden;
            animation: modalSlideUp 0.3s ease-out;
        }

        .player-modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .ace-banner {
            display: none;
            background: #dc2626;
            color: #fff;
            font-weight: bold;
            font-size: 1.3rem;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .player-modal-header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-bottom: 10px;
        }

        .player-modal-name {
            font-family: 'Oswald', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-primary);
            text-align: center;
            margin: 20px 0;
        }

        .player-modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.8rem;
            cursor: pointer;
            padding: 5px 10px;
            line-height: 1;
            transition: color 0.2s;
        }

        .player-modal-close:hover {
            color: var(--text-primary);
        }

        .player-modal-section {
            margin-bottom: 25px;
        }

        .player-modal-section:last-child {
            margin-bottom: 0;
        }

        .player-modal-section-label {
            font-family: 'Oswald', sans-serif;
            font-size: 2.4rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .player-modal-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .player-modal-buttons.attack-buttons {
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .player-modal-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 20px 10px;
            border: none;
            border-radius: 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .player-modal-buttons.attack-buttons .player-modal-btn {
            padding: 20px 10px;
            font-size: 1.2rem;
        }

        .player-modal-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .player-modal-btn:active::after {
            width: 300px;
            height: 300px;
        }

        .player-modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .player-modal-btn.ace-btn { background: var(--accent-green); }
        .player-modal-btn.serve-inplay-btn { background: #6b7280; }
        .player-modal-btn.serve-error-btn { background: #991b1b; }
        .player-modal-btn.kill-btn { background: var(--accent-green); }
        .player-modal-btn.error-btn { background: #991b1b; }
        .player-modal-btn.block-btn { background: #3b82f6; }
        .player-modal-btn.inplay-btn { background: #6b7280; }

        .stats-table {
            background: var(--bg-card);
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
        }

        .stats-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .stats-table th {
            background: var(--bg-primary);
            padding: 12px;
            text-align: left;
            font-family: 'Oswald', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
            white-space: nowrap;
        }

        .stats-table th:hover {
            color: var(--accent-secondary);
        }

        .sort-arrow {
            font-size: 0.75rem;
            margin-left: 4px;
            color: var(--text-secondary);
            opacity: 0.4;
        }

        .sort-arrow.active {
            color: var(--accent-secondary);
            opacity: 1;
        }

        .stats-table td {
            padding: 12px;
            border-top: 1px solid var(--border);
            font-size: 1.1rem;
            font-weight: 500;
        }

        .stats-table tr:hover {
            background: rgba(255, 102, 0, 0.1);
        }

        .stats-table .player-name {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--text-primary);
        }

        .percentage {
            font-family: 'Oswald', sans-serif;
            font-weight: 700;
            color: var(--accent-secondary);
        }

        .reset-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--border);
            text-align: center;
        }

        .finish-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 15px 40px;
            background: var(--accent-green);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);
        }

        .finish-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5); background: #059669; }
        .finish-btn:active { transform: scale(0.98); }

        .reset-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 15px 40px;
            background: var(--accent-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.3);
        }

        .reset-btn:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(239, 68, 68, 0.5); background: #dc2626; }
        .reset-btn:active { transform: scale(0.98); }

        .completed-match-banner {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: white;
            padding: 15px 30px;
            margin-bottom: 20px;
            border-radius: 10px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.3);
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-to-analytics-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 12px 30px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            margin-left: 15px;
        }

        .back-to-analytics-btn:hover {
            border-color: var(--accent-primary);
            transform: scale(1.05);
            background: var(--bg-card);
        }

        @media (max-width: 1200px) {
            .main-grid { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .app-title { font-size: 2.5rem; }
            .score-grid { grid-template-columns: 1fr; }
            .player-grid { grid-template-columns: 1fr; }
        }

        /* Save Set Modal */
        .save-set-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: modalFadeIn 0.25s ease-out;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .save-set-modal {
            background: var(--bg-secondary);
            border: 3px solid var(--accent-primary);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            position: relative;
            overflow: hidden;
            animation: modalSlideUp 0.3s ease-out;
        }

        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .save-set-modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
        }

        .save-set-modal-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-primary);
            margin-bottom: 10px;
        }

        .save-set-modal-score {
            font-family: 'Oswald', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 30px;
            letter-spacing: 2px;
        }

        .save-set-modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .save-set-modal-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
        }

        .save-set-modal-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .save-set-modal-btn.primary:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.5);
        }

        .save-set-modal-btn.secondary {
            background: var(--bg-card);
            color: var(--text-secondary);
            border: 2px solid var(--border);
        }

        .save-set-modal-btn.secondary:hover {
            border-color: var(--text-secondary);
            transform: scale(1.05);
        }

        /* Error Type Modal */
        .error-type-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .error-type-btn {
            font-family: 'Barlow Condensed', sans-serif;
            padding: 18px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            color: white;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .error-type-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .error-type-btn.serve-error { background: #dc2626; }
        .error-type-btn.pass-error { background: #2563eb; }
        .error-type-btn.penalty-error { background: #d97706; }

        /* Totals Row */
        .totals-row {
            border-top: 2px solid var(--accent-primary);
            background: var(--bg-primary);
        }

        /* Error Tracking Table Section */
        .error-tracking-section {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 25px;
            border: 2px solid var(--border);
            position: relative;
            overflow: hidden;
            margin-top: 30px;
        }

        .error-tracking-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #991b1b, #dc2626);
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Completed Match Banner (shown only for completed matches) -->
        <div id="completed-match-banner" style="display: none;"></div>

        <div class="app-header">

                        <button class="player-btn" onclick="showPlayerModal('Grace')">Grace</button>

                    <div class="player-card" id="player-laura">
                        <button class="player-btn" onclick="showPlayerModal('Laura')">Laura</button>
                    </div>
                    <div class="player-card" id="player-lila">
                        <button class="player-btn" onclick="showPlayerModal('Lila')">Lila</button>
                    </div>
                    <div class="player-card" id="player-kjersten">
                        <button class="player-btn" onclick="showPlayerModal('Kjersten')">Kjersten</button>
                    </div>

                        <button class="player-btn" onclick="showPlayerModal('Adelaide')">Adelaide</button>

                        <button class="player-btn" onclick="showPlayerModal('Greta')">Greta</button>

        <div class="reset-section">
            <button class="reset-btn" onclick="resetAllStats()">Reset and Delete Match</button>
        </div>
    </div>

    <script>
        // Register service worker
        registerServiceWorker();

        // Try to initialize Supabase (may be null if offline)
        var db = tryInitSupabase();

        // Get match ID from URL
        var urlParams = new URLSearchParams(window.location.search);
        var matchId = urlParams.get('matchId');

        if (!matchId) {
            alert('No match ID provided. Redirecting to home page.');
            window.location.href = 'index.html';
        }

        // Unique ID for this tab (used for match locking)
        var tabId = OfflineStorage.generateUUID();
        var lockHeartbeatTimer = null;

        // State management
        var currentSet = 1;
        var selectedPlayer = null;
        var matchInfo = null;

        // Undo history
        var undoHistory = [];
        var MAX_UNDO_HISTORY = 10;

        // Track which sets have had the save prompt dismissed
        var setPromptDismissed = { 1: false, 2: false, 3: false };

        // Initialize match data structure
        var matchData = {
            sets: {
                1: { team1: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, team2: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, attack_errors: 0, block_errors: 0, serve_errors: 0, pass_errors: 0, penalty_errors: 0 },
                2: { team1: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, team2: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, attack_errors: 0, block_errors: 0, serve_errors: 0, pass_errors: 0, penalty_errors: 0 },
                3: { team1: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, team2: { score: 0, kills: 0, blocks: 0, serves: 0, errors: 0 }, attack_errors: 0, block_errors: 0, serve_errors: 0, pass_errors: 0, penalty_errors: 0 }
            },
            savedSets: []
        };

        // Player stats sort state
        var trackerSortColumn = 'name';
        var trackerSortDirection = 'asc';

        // Player stats (cumulative across match)
        var playerStats = {
            'Lexi': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Anne': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Cora': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Amelie': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Norah': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Grace': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Laura': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Lila': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Kjersten': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Adelaide': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Greta': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
            'Hannah': { attempts: 0, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 }
        };

        // Serve stats sort state (for serve tracking table)
        var serveSortColumn = 'name';
        var serveSortDirection = 'asc';

        // ===== MATCH FORMAT HELPERS =====

        function getWinScore(setNumber) {
            if (setNumber === 3) return 15;
            if (matchInfo && matchInfo.match_format === 'pool_play' && matchInfo.scoring_format === '0_to_21') {
                return 21;
            }
            return 25;
        }

        function getStartingScore(setNumber) {
            if (setNumber === 3) return 0;
            if (matchInfo && matchInfo.match_format === 'pool_play' && matchInfo.scoring_format === '4_to_25') {
                return 4;
            }
            return 0;
        }

        function getFormatLabel() {
            if (!matchInfo || !matchInfo.match_format) return '';
            if (matchInfo.match_format === 'pool_play') {
                if (matchInfo.scoring_format === '0_to_21') return 'Pool Play (to 21)';
                if (matchInfo.scoring_format === '4_to_25') return 'Pool Play (4 to 25)';
                return 'Pool Play';
            }
            return 'Bracket Play';
        }

        function initializeStartingScores() {
            for (var s = 1; s <= 3; s++) {
                var startScore = getStartingScore(s);
                if (startScore > 0) {
                    // Only set starting scores if the set hasn't been played yet
                    var set = matchData.sets[s];
                    if (set.team1.score === 0 && set.team2.score === 0 &&
                        set.team1.kills === 0 && set.team1.blocks === 0 &&
                        set.team1.serves === 0 && set.team1.errors === 0 &&
                        set.team2.kills === 0 && set.team2.blocks === 0 &&
                        set.team2.serves === 0 && set.team2.errors === 0) {
                        set.team1.score = startScore;
                        set.team2.score = startScore;
                    }
                }
            }
        }

        // ===== LOAD MATCH DATA (LOCAL-FIRST, SUPABASE FALLBACK) =====

        async function loadMatchData() {
            // Acquire cross-tab lock before editing this match
            var lockAcquired = OfflineStorage.acquireMatchLock(matchId, tabId);
            if (!lockAcquired) {
                alert('This match is already open in another tab. Please close the other tab first.');
                window.location.href = 'index.html';
                return;
            }

            // Start heartbeat to keep the lock alive
            lockHeartbeatTimer = setInterval(function() {
                OfflineStorage.refreshMatchLock(matchId, tabId);
            }, 5000);

            // Load match info from localStorage
            matchInfo = OfflineStorage.getMatch(matchId);

            // If not in localStorage, try loading from Supabase (for viewing completed matches from analytics)
            if (!matchInfo && db) {
                try {
                    var { data: matchRow, error: matchErr } = await db
                        .from('matches')
                        .select('*')
                        .eq('match_id', matchId)
                        .single();

                    if (!matchErr && matchRow) {
                        matchInfo = {
                            match_id: matchRow.match_id,
                            tournament: matchRow.tournament,
                            team1_name: matchRow.team1_name,
                            opponent_name: matchRow.opponent_name,
                            match_format: matchRow.match_format || 'bracket_play',
                            scoring_format: matchRow.scoring_format || null,
                            match_status: matchRow.match_status,
                            sync_status: 'synced',
                            created_at: matchRow.created_at
                        };

                        // Load sets from Supabase
                        var { data: setRows } = await db
                            .from('set_scores')
                            .select('*')
                            .eq('match_id', matchId)
                            .order('set_number');

                        if (setRows) {
                            var setsObj = {};
                            setRows.forEach(function(s) {
                                setsObj[s.set_number] = {
                                    set_status: s.set_status || 'completed',
                                    team1_score: s.team1_score, team1_kills: s.team1_kills,
                                    team1_blocks: s.team1_blocks, team1_serves: s.team1_serves,
                                    team1_errors: s.team1_errors,
                                    team2_score: s.team2_score, team2_kills: s.team2_kills,
                                    team2_blocks: s.team2_blocks, team2_serves: s.team2_serves,
                                    team2_errors: s.team2_errors,
                                    attack_errors: s.attack_errors || 0,
                                    block_errors: s.block_errors || 0,
                                    serve_errors: s.serve_errors || 0,
                                    pass_errors: s.pass_errors || 0,
                                    penalty_errors: s.penalty_errors || 0
                                };
                            });
                            OfflineStorage.saveSets(matchId, setsObj);
                        }

                        // Load player stats from Supabase
                        var { data: playerRows } = await db
                            .from('player_stats')
                            .select('*')
                            .eq('match_id', matchId);

                        if (playerRows) {
                            var statsObj = {};
                            playerRows.forEach(function(p) {
                                statsObj[p.player_name] = {
                                    attempts: p.attempts,
                                    kills: p.kills,
                                    errors: p.errors,
                                    serves: p.serves || 0,
                                    aces: p.aces || 0,
                                    serve_errors: p.serve_errors || 0
                                };
                            });
                            OfflineStorage.saveAllPlayerStats(matchId, statsObj);
                        }

                        // Save match info locally (temporarily for viewing)
                        OfflineStorage.saveMatch(matchInfo);
                    }
                } catch (err) {
                    console.warn('Could not load match from Supabase:', err);
                }
            }

            if (!matchInfo) {
                alert('Match not found. Redirecting to home page.');
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('team2-name').textContent = matchInfo.opponent_name;

            // Load sets from localStorage
            var localSets = OfflineStorage.getSets(matchId);
            var setNumbers = Object.keys(localSets);

            if (setNumbers.length > 0) {
                setNumbers.forEach(function(setNum) {
                    var set = localSets[setNum];
                    var n = parseInt(setNum);
                    matchData.sets[n] = {
                        team1: {
                            score: set.team1_score || 0,
                            kills: set.team1_kills || 0,
                            blocks: set.team1_blocks || 0,
                            serves: set.team1_serves || 0,
                            errors: set.team1_errors || 0
                        },
                        team2: {
                            score: set.team2_score || 0,
                            kills: set.team2_kills || 0,
                            blocks: set.team2_blocks || 0,
                            serves: set.team2_serves || 0,
                            errors: set.team2_errors || 0
                        },
                        attack_errors: set.attack_errors || 0,
                        block_errors: set.block_errors || 0,
                        serve_errors: set.serve_errors || 0,
                        pass_errors: set.pass_errors || 0,
                        penalty_errors: set.penalty_errors || 0
                    };

                    if (set.set_status === 'completed') {
                        matchData.savedSets.push({
                            setNum: n,
                            team1Score: set.team1_score || 0,
                            team2Score: set.team2_score || 0,
                            team1Name: 'Des Moines Eclipse',
                            team2Name: matchInfo.opponent_name
                        });
                    }
                });

                // Determine which set to display
                var setToDisplay = 1;
                for (var i = 1; i <= 3; i++) {
                    var localSet = localSets[i];
                    if (localSet && localSet.set_status === 'in_progress') {
                        setToDisplay = i;
                        break;
                    }
                    if (!localSet || localSet.set_status !== 'completed') {
                        setToDisplay = i;
                        break;
                    }
                }
                if (matchData.savedSets.length === 3) {
                    setToDisplay = 3;
                }

                currentSet = setToDisplay;
                document.querySelectorAll('.set-badge').forEach(function(badge) {
                    badge.classList.remove('active');
                });
                document.querySelector('[data-set="' + setToDisplay + '"]').classList.add('active');

                displaySetHistory();
            }

            // Initialize starting scores for unplayed sets (e.g., 4-25 pool play)
            initializeStartingScores();

            // Load player stats from localStorage
            var localPlayerStats = OfflineStorage.getAllPlayerStats(matchId);
            Object.keys(localPlayerStats).forEach(function(name) {
                if (playerStats[name]) {
                    playerStats[name] = {
                        attempts: localPlayerStats[name].attempts || 0,
                        kills: localPlayerStats[name].kills || 0,
                        errors: localPlayerStats[name].errors || 0,
                        serves: localPlayerStats[name].serves || 0,
                        aces: localPlayerStats[name].aces || 0,
                        serveErrors: localPlayerStats[name].serve_errors || 0
                    };
                }
            });

            updateScoreDisplay();
            updatePlayerStatsDisplay();
            updateSetBadgeVisibility();

            // Show banner if match is completed
            if (matchInfo.match_status === 'completed') {
                showCompletedMatchBanner();
            }
        }

        function showCompletedMatchBanner() {
            var banner = document.getElementById('completed-match-banner');
            var backBtn = document.getElementById('back-to-analytics-btn');

            var matchDate = new Date(matchInfo.created_at);
            var formattedDate = (matchDate.getMonth() + 1) + '/' + matchDate.getDate() + '/' + matchDate.getFullYear();

            banner.innerHTML = 'Viewing Completed Match - ' + formattedDate;
            banner.className = 'completed-match-banner';
            banner.style.display = 'block';

            backBtn.style.display = 'inline-block';
        }

        function backToAnalytics() {
            window.location.href = 'analyze-stats.html';
        }

        // ===== SET SWITCHING =====

        document.querySelectorAll('.set-badge').forEach(function(badge) {
            badge.addEventListener('click', function() {
                var setNum = parseInt(this.dataset.set);
                switchSet(setNum);
            });
        });

        function switchSet(setNum) {
            currentSet = setNum;
            document.querySelectorAll('.set-badge').forEach(function(badge) {
                badge.classList.remove('active');
            });
            document.querySelector('[data-set="' + setNum + '"]').classList.add('active');
            updateScoreDisplay();
        }

        function updateSetBadgeVisibility() {
            var savedSetNums = matchData.savedSets.map(function(s) { return s.setNum; });
            var set2Badge = document.querySelector('[data-set="2"]');
            var set3Badge = document.querySelector('[data-set="3"]');

            // Show Set 2 if Set 1 has been saved
            set2Badge.style.display = savedSetNums.indexOf(1) >= 0 ? '' : 'none';
            // Show Set 3 if Set 2 has been saved
            set3Badge.style.display = savedSetNums.indexOf(2) >= 0 ? '' : 'none';
        }

        // ===== SCORE TRACKING =====

        function scorePoint(team, method, errorType, skipUndo) {
            var teamKey = 'team' + team;

            if (!skipUndo) {
                addToUndoHistory({
                    player: null,
                    score: { team: team, method: method, errorType: errorType || null },
                    setNumber: currentSet
                });
            }

            matchData.sets[currentSet][teamKey].score++;

            if (method === 'kill') matchData.sets[currentSet][teamKey].kills++;
            else if (method === 'block') matchData.sets[currentSet][teamKey].blocks++;
            else if (method === 'serve') matchData.sets[currentSet][teamKey].serves++;
            else if (method === 'error') matchData.sets[currentSet][teamKey].errors++;

            // Increment error subtype if specified
            if (errorType) {
                matchData.sets[currentSet][errorType + '_errors']++;
            }

            updateScoreDisplay();
            autoSaveSet();
            checkSetComplete();
        }

        function updateScoreDisplay() {
            var set = matchData.sets[currentSet];

            document.getElementById('team1-score').textContent = set.team1.score;
            document.getElementById('team1-kills').textContent = set.team1.kills;
            document.getElementById('team1-blocks').textContent = set.team1.blocks;
            document.getElementById('team1-serves').textContent = set.team1.serves;
            document.getElementById('team1-errors').textContent = set.team1.errors;

            document.getElementById('team2-score').textContent = set.team2.score;
            document.getElementById('team2-kills').textContent = set.team2.kills;
            document.getElementById('team2-blocks').textContent = set.team2.blocks;
            document.getElementById('team2-serves').textContent = set.team2.serves;
            document.getElementById('team2-errors').textContent = set.team2.errors;

            updateErrorTrackingTable();
        }

        // ===== ERROR TYPE MODAL =====

        function showErrorTypeModal() {
            var overlay = document.createElement('div');
            overlay.className = 'save-set-modal-overlay';
            overlay.id = 'error-type-modal';
            overlay.innerHTML = `
                <div class="save-set-modal">
                    <div class="save-set-modal-title">Error Type</div>
                    <div class="error-type-buttons">
                        <button class="error-type-btn pass-error" onclick="recordErrorType('pass')">Pass</button>
                        <button class="error-type-btn penalty-error" onclick="recordErrorType('penalty')">Penalty</button>
                    </div>
                    <div style="margin-top: 15px;">
                        <button class="save-set-modal-btn secondary" onclick="closeErrorTypeModal()">Cancel</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
        }

        function recordErrorType(errorType) {
            closeErrorTypeModal();
            scorePoint(2, 'error', errorType);
        }

        function closeErrorTypeModal() {
            var modal = document.getElementById('error-type-modal');
            if (modal) modal.remove();
        }

        // ===== ERROR TRACKING TABLE =====

        function updateErrorTrackingTable() {
            var tbody = document.getElementById('error-tracking-body');
            if (!tbody) return;

            var html = '';
            var maxSet = currentSet;
            matchData.savedSets.forEach(function(s) {
                if (s.setNum > maxSet) maxSet = s.setNum;
            });

            for (var s = 1; s <= maxSet; s++) {
                var set = matchData.sets[s];

                var serving = set.serve_errors || 0;
                var passing = set.pass_errors || 0;
                var penalty = set.penalty_errors || 0;

                html += '<tr>';
                html += '<td class="player-name">Set ' + s + '</td>';
                html += '<td>' + hitting + '</td>';
                html += '<td>' + serving + '</td>';
                html += '<td>' + passing + '</td>';
                html += '<td>' + penalty + '</td>';
                html += '</tr>';
            }

            tbody.innerHTML = html;
        }

        // ===== SERVE TRACKING =====

        function recordServe(player, outcome) {
            var isAce = outcome === 'ace';
            if (!isAce) {
                closePlayerModal();
            }
            var stats = playerStats[player];

            var undoEntry = {
                player: { name: player, attempts: 0, kills: 0, errors: 0, serves: 1, aces: 0, serveErrors: 0 },
                score: null,
                setNumber: currentSet
            };

            stats.serves++;

            if (isAce) {
                stats.aces++;
                undoEntry.player.aces = 1;
                undoEntry.score = { team: 1, method: 'serve', errorType: null };
                scorePoint(1, 'serve', null, true);
            } else if (outcome === 'error') {
                stats.serveErrors++;
                undoEntry.player.serveErrors = 1;
                undoEntry.score = { team: 2, method: 'error', errorType: 'serve' };
                scorePoint(2, 'error', 'serve', true);
            }
            addToUndoHistory(undoEntry);
            savePlayerStatToStorage(player, stats);
            updatePlayerStatsDisplay();

            if (isAce) {
                // Check if set completed on this ace — if so, close modal
                var set = matchData.sets[currentSet];
                var winScore = getWinScore(currentSet);
                var score1 = set.team1.score;
                var score2 = set.team2.score;
                if ((score1 >= winScore || score2 >= winScore) && Math.abs(score1 - score2) >= 2) {
                    closePlayerModal();
                    return;
                }
                // Show ace banner for 5 seconds
                var banner = document.getElementById('ace-banner');
                if (banner) {
                    banner.style.display = 'block';
                    clearTimeout(window._aceBannerTimeout);
                    window._aceBannerTimeout = setTimeout(function() {
                        banner.style.display = 'none';
                    }, 5000);
                }
            }
        }

        // ===== ATTACK TRACKING =====

        function recordAttack(player, outcome) {
            closePlayerModal();
            var stats = playerStats[player];

            var undoEntry = {
                player: { name: player, attempts: 1, kills: 0, errors: 0, serves: 0, aces: 0, serveErrors: 0 },
                score: null,
                setNumber: currentSet
            };

            stats.attempts++;
            if (outcome === 'kill') {
                stats.kills++;
                undoEntry.player.kills = 1;
                undoEntry.score = { team: 1, method: 'kill', errorType: null };
                scorePoint(1, 'kill', null, true);
            } else if (outcome === 'error') {
                stats.errors++;
                undoEntry.player.errors = 1;
                undoEntry.score = { team: 2, method: 'error', errorType: 'attack' };
                scorePoint(2, 'error', 'attack', true);
            } else if (outcome === 'block') {
                stats.errors++;
                undoEntry.player.errors = 1;
                undoEntry.score = { team: 2, method: 'block', errorType: 'block' };
                scorePoint(2, 'block', 'block', true);
            }
            // 'inplay' — only attempt incremented, no score change

            addToUndoHistory(undoEntry);
            savePlayerStatToStorage(player, stats);
            updatePlayerStatsDisplay();
        }

        function savePlayerStatToStorage(player, stats) {
            OfflineStorage.savePlayerStat(matchId, player, {
                attempts: stats.attempts,
                kills: stats.kills,
                errors: stats.errors,
                serves: stats.serves,
                aces: stats.aces,
                serve_errors: stats.serveErrors
            });
            OfflineStorage.markMatchPending(matchId);

            // Try to sync to Supabase in the background (skip in demo mode)
            if (db && !isDemoMode()) {
                db.from('player_stats').upsert({
                    match_id: matchId,
                    player_name: player,
                    team_name: 'Des Moines Eclipse',
                    attempts: stats.attempts,
                    kills: stats.kills,
                    errors: stats.errors,
                    serves: stats.serves,
                    aces: stats.aces,
                    serve_errors: stats.serveErrors
                }, { onConflict: 'match_id,player_name' }).select().then(function(result) {
                    if (result.error) {
                        // Retry without serve columns if they don't exist yet
                        db.from('player_stats').upsert({
                            match_id: matchId,
                            player_name: player,
                            team_name: 'Des Moines Eclipse',
                            attempts: stats.attempts,
                            kills: stats.kills,
                            errors: stats.errors
                        }, { onConflict: 'match_id,player_name' }).select().then(function(retryResult) {
                            if (retryResult.error) {
                                console.warn('Save player stats to Supabase failed:', retryResult.error);
                            }
                        });
                    }
                }).catch(function(err) {
                    console.warn('Save player stats to Supabase exception:', err);
                });
            }
        }

        function trackerSortArrowHTML(column) {
            if (trackerSortColumn === column) {
                var arrow = trackerSortDirection === 'asc' ? '▲' : '▼';
                return '<span class="sort-arrow active">' + arrow + '</span>';
            }
            return '<span class="sort-arrow">▲▼</span>';
        }

        function sortTrackerStats(column) {
            if (trackerSortColumn === column) {
                trackerSortDirection = trackerSortDirection === 'desc' ? 'asc' : 'desc';
            } else {
                trackerSortColumn = column;
                trackerSortDirection = column === 'name' ? 'asc' : 'desc';
            }
            renderStatsTable();
        }

        function renderStatsTable() {
            var playersArray = Object.keys(playerStats).map(function(player) {
                var stats = playerStats[player];
                var killPct = stats.attempts > 0 ? (stats.kills / stats.attempts) : 0;
                var hitPct = stats.attempts > 0 ? ((stats.kills - stats.errors) / stats.attempts) : 0;
                return {
                    name: player,
                    attempts: stats.attempts,
                    kills: stats.kills,
                    errors: stats.errors,
                    killPct: killPct,
                    hitPct: hitPct
                };
            });

            var sorted = playersArray.slice();
            sorted.sort(function(a, b) {
                var valA = a[trackerSortColumn];
                var valB = b[trackerSortColumn];
                if (trackerSortColumn === 'name') {
                    valA = valA.toLowerCase();
                    valB = valB.toLowerCase();
                    return trackerSortDirection === 'asc'
                        ? valA.localeCompare(valB)
                        : valB.localeCompare(valA);
                }
                return trackerSortDirection === 'asc' ? valA - valB : valB - valA;
            });

            // Calculate team totals
            var totalAtt = 0, totalK = 0, totalE = 0;
            playersArray.forEach(function(p) {
                totalAtt += p.attempts;
                totalK += p.kills;
                totalE += p.errors;
            });
            var totalKillPct = totalAtt > 0 ? (totalK / totalAtt) : 0;
            var totalHitPct = totalAtt > 0 ? ((totalK - totalE) / totalAtt) : 0;

            var columns = [
                { key: 'name', label: 'Player' },
                { key: 'attempts', label: 'Att' },
                { key: 'kills', label: 'K' },
                { key: 'errors', label: 'E' },
                { key: 'killPct', label: 'K%' },
                { key: 'hitPct', label: 'Hit%' }
            ];

            var tableHTML = '<table><thead><tr>';
            columns.forEach(function(col) {
                tableHTML += '<th onclick="sortTrackerStats(\'' + col.key + '\')">' + col.label + trackerSortArrowHTML(col.key) + '</th>';
            });
            tableHTML += '</tr></thead><tbody>';

            sorted.forEach(function(player) {
                var killPctDisplay = player.attempts > 0 ? player.killPct.toFixed(3).replace(/^(-?)0/, '$1') : '.000';
                var hitPctDisplay = player.attempts > 0 ? player.hitPct.toFixed(3).replace(/^(-?)0/, '$1') : '.000';
                tableHTML += '<tr>';
                tableHTML += '<td class="player-name">' + OfflineStorage.escapeHTML(player.name) + '</td>';
                tableHTML += '<td>' + player.attempts + '</td>';
                tableHTML += '<td>' + player.kills + '</td>';
                tableHTML += '<td>' + player.errors + '</td>';
                tableHTML += '<td class="percentage">' + killPctDisplay + '</td>';
                tableHTML += '<td class="percentage">' + hitPctDisplay + '</td>';
                tableHTML += '</tr>';
            });

            // Team Totals row
            var totalKillPctDisplay = totalAtt > 0 ? totalKillPct.toFixed(3).replace(/^(-?)0/, '$1') : '.000';
            var totalHitPctDisplay = totalAtt > 0 ? totalHitPct.toFixed(3).replace(/^(-?)0/, '$1') : '.000';
            tableHTML += '<tr class="totals-row">';
            tableHTML += '<td class="player-name"><strong>Team Total</strong></td>';
            tableHTML += '<td><strong>' + totalAtt + '</strong></td>';
            tableHTML += '<td><strong>' + totalK + '</strong></td>';
            tableHTML += '<td><strong>' + totalE + '</strong></td>';
            tableHTML += '<td class="percentage"><strong>' + totalKillPctDisplay + '</strong></td>';
            tableHTML += '<td class="percentage"><strong>' + totalHitPctDisplay + '</strong></td>';
            tableHTML += '</tr>';

            tableHTML += '</tbody></table>';
            document.getElementById('stats-table-container').innerHTML = tableHTML;

        // ===== FINISH MATCH (LOCAL-FIRST) =====

        async function finishMatch() {
            if (!confirm('Are you ready to finish this match? This will mark the match as completed and return you to the home page.')) {
                return;
            }

            // Auto-save any sets with scores before finishing
            for (var setNum = 1; setNum <= 3; setNum++) {
                var set = matchData.sets[setNum];
                var hasScores = set.team1.score > 0 || set.team2.score > 0;
                if (!hasScores) continue;

                var alreadySaved = matchData.savedSets.find(function(s) { return s.setNum === setNum; });

                var setData = {
                    set_status: 'completed',
                    team1_score: set.team1.score,
                    team1_kills: set.team1.kills,
                    team1_blocks: set.team1.blocks,
                    team1_serves: set.team1.serves,
                    team1_errors: set.team1.errors,
                    team2_score: set.team2.score,
                    team2_kills: set.team2.kills,
                    team2_blocks: set.team2.blocks,
                    team2_serves: set.team2.serves,
                    team2_errors: set.team2.errors,
                    attack_errors: set.attack_errors || 0,
                    block_errors: set.block_errors || 0,
                    serve_errors: set.serve_errors || 0,
                    pass_errors: set.pass_errors || 0,
                    penalty_errors: set.penalty_errors || 0
                };
                OfflineStorage.saveSet(matchId, setNum, setData);

                // Add unsaved sets to savedSets so they appear in history and sync
                if (!alreadySaved) {
                    matchData.savedSets.push({
                        setNum: setNum,
                        team1Score: set.team1.score,
                        team2Score: set.team2.score,
                        team1Name: 'Des Moines Eclipse',
                        team2Name: matchInfo.opponent_name
                    });
                }
            }

            // Save all player stats to localStorage
            Object.keys(playerStats).forEach(function(player) {
                var stats = playerStats[player];
                if (stats.attempts > 0 || stats.kills > 0 || stats.errors > 0 || stats.serves > 0) {
                    OfflineStorage.savePlayerStat(matchId, player, {
                        attempts: stats.attempts,
                        kills: stats.kills,
                        errors: stats.errors,
                        serves: stats.serves,
                        aces: stats.aces,
                        serve_errors: stats.serveErrors
                    });
                }
            });

            // Update match status locally
            matchInfo.match_status = 'completed';
            matchInfo.sync_status = 'pending';
            OfflineStorage.saveMatch(matchInfo);

            // Show syncing state on the finish button
            var finishBtn = document.getElementById('finish-match-btn');
            finishBtn.disabled = true;
            finishBtn.textContent = 'Syncing...';

            // Await sync to Supabase before navigating (skip in demo mode)
            if (db && !isDemoMode()) {
                try {
                    var success = await OfflineStorage.syncMatchToSupabase(db, matchId);
                    if (success) {
                        OfflineStorage.markMatchSynced(matchId);
                    }
                } catch (e) {
                    console.warn('Sync on finish failed, will retry from home page:', e);
                }
            }

            window.location.href = 'index.html';
        }

        // ===== RESET / DELETE MATCH =====

        function resetAllStats() {
            if (!confirm('Are you sure you want to clear stats? This will delete this match and all associated data. This action cannot be undone.')) {
                return;
            }

            // Remove from localStorage
            OfflineStorage.removeMatch(matchId);

            // Try to delete from Supabase too (skip in demo mode)
            if (db && !isDemoMode()) {
                db.from('matches').delete().eq('match_id', matchId).then(function(result) {
                    if (result.error) {
                        console.warn('Delete from Supabase failed:', result.error);
                    }
                }).catch(function() {});
            }

            alert('Match deleted successfully.');
            window.location.href = 'index.html';
        }

        // ===== UNDO SYSTEM =====

        function addToUndoHistory(action) {
            undoHistory.push(action);
            if (undoHistory.length > MAX_UNDO_HISTORY) undoHistory.shift();
            updateUndoButton();
        }

        function updateUndoButton() {
            document.getElementById('score-undo-btn').disabled = undoHistory.length === 0;
        }

        function clearUndoHistory() {
            undoHistory = [];
            updateUndoButton();
        }

        function undoLastAction() {
            if (undoHistory.length === 0) return;

            var action = undoHistory.pop();

            // Undo player stats if applicable
            if (action.player) {
                var stats = playerStats[action.player.name];
                stats.attempts -= action.player.attempts || 0;
                stats.kills -= action.player.kills || 0;
                stats.errors -= action.player.errors || 0;
                stats.serves -= action.player.serves || 0;
                stats.aces -= action.player.aces || 0;
                stats.serveErrors -= action.player.serveErrors || 0;

                savePlayerStatToStorage(action.player.name, stats);
                updatePlayerStatsDisplay();
            }

            // Undo score if applicable
            if (action.score) {
                var teamKey = 'team' + action.score.team;
                var set = matchData.sets[action.setNumber];

                set[teamKey].score--;
                if (action.score.method === 'kill') set[teamKey].kills--;
                else if (action.score.method === 'block') set[teamKey].blocks--;
                else if (action.score.method === 'serve') set[teamKey].serves--;
                else if (action.score.method === 'error') set[teamKey].errors--;

                if (action.score.errorType) {
                    set[action.score.errorType + '_errors']--;
                }

                updateScoreDisplay();
                autoSaveSet();
            }

            updateUndoButton();
        }

        // ===== INITIALIZE =====

        window.addEventListener('DOMContentLoaded', function() {
            renderStatsTable();
            renderServeStatsTable();
            loadMatchData();
        });

        // Warn before leaving during active match + release lock
        window.addEventListener('beforeunload', function(e) {
            if (lockHeartbeatTimer) clearInterval(lockHeartbeatTimer);
            OfflineStorage.releaseMatchLock(matchId, tabId);

            // Warn if match is in progress and has any scores
            if (matchInfo && matchInfo.match_status === 'in_progress') {
                var hasScores = false;
                for (var s = 1; s <= 3; s++) {
                    var set = matchData.sets[s];
                    if (set.team1.score > 0 || set.team2.score > 0) {
                        hasScores = true;
                        break;
                    }
                }
                if (hasScores) {
                    e.preventDefault();
                    e.returnValue = '';
                }
            }
        });
    </script>
</body>
</html>
