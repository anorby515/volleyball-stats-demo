<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Des Moines Eclipse Stat Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app-mode.js"></script>
    <script src="config.js"></script>
    <script src="offline-storage.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap');

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-card: #3a3a3a;
            --accent-primary: #dc2626;
            --accent-secondary: #ef4444;
            --accent-green: #10b981;
            --text-primary: #f5f5f5;
            --text-secondary: #9ca3af;
            --border: #525252;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Barlow Condensed', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Sync Status Bar */
        .sync-status-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 8px 16px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .sync-status-bar.online-synced {
            background: var(--accent-green);
            color: white;
        }

        .sync-status-bar.online-syncing {
            background: #f59e0b;
            color: #1a1a1a;
        }

        .sync-status-bar.online-failed {
            background: #f59e0b;
            color: #1a1a1a;
        }

        .sync-status-bar.offline {
            background: #f97316;
            color: white;
        }

        .sync-status-bar.offline-warning {
            background: #ef4444;
            color: white;
        }

        .sync-status-bar.hidden {
            transform: translateY(-100%);
            opacity: 0;
        }

        .container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            padding-top: 50px;
            padding-bottom: 50px;
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .app-title {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-transform: uppercase;
            margin-bottom: 15px;
            animation: titleSlide 0.8s ease-out;
        }

        @keyframes titleSlide {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .team-logo {
            max-width: 200px;
            height: auto;
            margin: 0 auto 20px;
            display: block;
        }

        .subtitle {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 60px;
            letter-spacing: 1px;
        }

        .options-grid {
            display: grid;
            gap: 25px;
            max-width: 600px;
            margin: 0 auto;
            animation: slideUp 0.8s ease-out 0.2s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .option-card {
            background: var(--bg-secondary);
            border: 3px solid var(--border);
            border-radius: 15px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .option-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .option-card:hover::before {
            transform: scaleX(1);
        }

        .option-card:hover {
            border-color: var(--accent-primary);
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 40px rgba(220, 38, 38, 0.3);
            background: var(--bg-card);
        }

        .option-card:active {
            transform: translateY(-4px) scale(1.01);
        }

        .option-title {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .option-description {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .coming-soon:hover {
            transform: none;
            border-color: var(--border);
            box-shadow: none;
            background: var(--bg-secondary);
        }

        .coming-soon::before {
            display: none;
        }

        .option-card.disabled-offline {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .option-card.disabled-offline:hover {
            transform: none;
            border-color: var(--border);
            box-shadow: none;
            background: var(--bg-secondary);
        }

        .option-card.disabled-offline::before {
            display: none;
        }

        .badge {
            display: inline-block;
            background: var(--accent-primary);
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--text-secondary);
            margin-top: 15px;
        }

        .resume-match-btn {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
            width: 100%;
        }

        .resume-match-btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
            transform: translateX(5px);
        }

        .resume-match-teams {
            font-family: 'Oswald', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .resume-match-time {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.95rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .resume-match-stale {
            color: #dc3545;
        }

        .resume-match-delete {
            margin-top: 8px;
            padding: 4px 12px;
            background: #dc3545;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
        }

        .resume-match-sets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .resume-set-badge {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 5px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .resume-set-badge.completed {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .resume-set-badge.in-progress {
            border-color: #f59e0b;
            color: #f59e0b;
        }

        .resume-match-format {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-secondary);
            margin-top: 4px;
        }

        .resume-match-sync-badge {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 8px;
            vertical-align: middle;
        }

        .resume-match-sync-badge.pending {
            background: #f97316;
            color: white;
        }

        .demo-banner {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 16px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #000;
            text-align: center;
            z-index: 1001;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .app-version {
            position: fixed;
            bottom: 10px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 1.125rem;
            font-weight: 600;
            color: var(--accent-primary);
            letter-spacing: 0.5px;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
            z-index: 999;
        }

        @media (max-width: 768px) {
            .app-title {
                font-size: 2.5rem;
            }

            .subtitle {
                font-size: 1.4rem;
            }

            .option-title {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <!-- Demo Mode Banner -->
    <div class="demo-banner" id="demo-banner">Demo Mode — Data will not be saved</div>

    <!-- Sync Status Bar -->
    <div class="sync-status-bar hidden" id="sync-status-bar"></div>

    <div class="app-version" id="app-version"></div>

    <div class="container">
        <h1 class="app-title">Stat Tracker</h1>
        <img src="eclipse-logo.png" alt="Des Moines Eclipse" class="team-logo">
        <p class="subtitle">What would you like to do today?</p>

        <div class="options-grid">
            <div class="option-card" onclick="startNewMatch()">
                <div class="option-title">Start a New Match</div>
                <div class="option-description">Begin tracking a new volleyball match</div>
            </div>

            <!-- Resume a Match - dynamically populated -->
            <div id="resume-match-container" style="display: none;">
                <div class="option-card" style="cursor: default; padding: 20px;">
                    <div class="option-title">Resume a Match</div>
                    <div class="option-description" style="margin-bottom: 20px;">Continue tracking an in-progress match</div>
                    <div id="resume-matches-list"></div>
                </div>
            </div>

            <div class="option-card" id="analyze-stats-card" onclick="goToAnalyzeStats()">
                <div class="option-title">Analyze Stats</div>
                <div class="option-description" id="analyze-stats-desc">View and analyze match statistics</div>
            </div>
        </div>
    </div>

    <script>
        // Register service worker
        registerServiceWorker();

        var db = null;
        var syncInProgress = false;
        var syncStatusReady = false;

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', function() {
            // Display app version
            document.getElementById('app-version').textContent = 'v' + APP_VERSION;

            // Try to initialize Supabase (may be null if offline)
            db = tryInitSupabase();

            // Always load local in-progress matches (works offline)
            loadLocalInProgressMatches();

            // In demo mode: show banner, cleanup stale demo data, hide sync bar, skip syncing
            if (isDemoMode()) {
                document.getElementById('demo-banner').style.display = 'block';
                document.getElementById('app-version').textContent = 'v' + APP_VERSION + ' — DEMO';
                document.getElementById('sync-status-bar').style.display = 'none';
                cleanupDemoData();
                loadLocalInProgressMatches(); // refresh after cleanup
                updateAnalyzeStatsButton();
                return;
            }

            updateAnalyzeStatsButton();

            // Try to sync if online (runs in background)
            if (db && OfflineStorage.isOnline()) {
                attemptSync();
            }

            // Delay showing sync status for 5 seconds to let sync complete first
            // This prevents the status bar from flickering through intermediate states
            setTimeout(function() {
                syncStatusReady = true;
                updateSyncStatus();
            }, 5000);
        });

        // Listen for online/offline events
        window.addEventListener('online', function() {
            console.log('Connection restored');
            // Re-init Supabase if needed
            if (!db) {
                db = tryInitSupabase();
            }
            if (db && !isDemoMode()) {
                attemptSync();
            }
            if (!isDemoMode()) {
                updateSyncStatus();
            }
            updateAnalyzeStatsButton();
        });

        window.addEventListener('offline', function() {
            console.log('Connection lost');
            if (!isDemoMode()) {
                updateSyncStatus();
            }
            updateAnalyzeStatsButton();
        });

        // ===== SYNC STATUS BAR =====

        function updateSyncStatus() {
            if (!syncStatusReady) return;

            var bar = document.getElementById('sync-status-bar');
            var pending = OfflineStorage.getPendingMatches();
            var lastSync = OfflineStorage.getLastSyncTime();
            var online = OfflineStorage.isOnline();

            if (syncInProgress) {
                bar.className = 'sync-status-bar online-syncing';
                bar.textContent = 'Syncing...';
                return;
            }

            if (online && pending.length === 0) {
                // Online and everything synced
                if (lastSync) {
                    var lastSyncDate = new Date(lastSync);
                    var timeAgo = getTimeAgo(lastSyncDate);
                    bar.className = 'sync-status-bar online-synced';
                    bar.textContent = 'Online — Last synced: ' + timeAgo;
                } else {
                    bar.className = 'sync-status-bar online-synced';
                    bar.textContent = 'Online';
                }
                // Auto-hide after 5 seconds if all good
                setTimeout(function() {
                    if (!syncInProgress && OfflineStorage.getPendingMatches().length === 0) {
                        bar.classList.add('hidden');
                    }
                }, 5000);
                return;
            }

            if (online && pending.length > 0) {
                bar.className = 'sync-status-bar online-failed';
                bar.textContent = 'Online — ' + pending.length + ' match(es) waiting to sync';
                return;
            }

            // Offline
            if (!online) {
                var daysSinceSync = getDaysSinceSync();

                if (daysSinceSync === null) {
                    bar.className = 'sync-status-bar offline';
                    bar.textContent = 'Offline — Not yet synced. Connect to internet to save your data.';
                } else if (daysSinceSync >= 5) {
                    bar.className = 'sync-status-bar offline-warning';
                    bar.textContent = 'Offline — Last synced: ' + Math.floor(daysSinceSync) + ' days ago. Data may be lost if not synced.';
                } else if (daysSinceSync >= 3) {
                    bar.className = 'sync-status-bar offline';
                    bar.textContent = 'Offline — Last synced: ' + Math.floor(daysSinceSync) + ' days ago. Connect to sync soon.';
                } else {
                    var lastSyncTime = new Date(OfflineStorage.getLastSyncTime());
                    bar.className = 'sync-status-bar offline';
                    bar.textContent = 'Offline — Last synced: ' + getTimeAgo(lastSyncTime);
                }
            }
        }

        function getTimeAgo(date) {
            var now = new Date();
            var diffMs = now - date;
            var diffMins = Math.floor(diffMs / 60000);
            var diffHours = Math.floor(diffMs / 3600000);
            var diffDays = Math.floor(diffMs / 86400000);

            if (diffMins < 1) return 'just now';
            if (diffMins < 60) return diffMins + ' minute' + (diffMins !== 1 ? 's' : '') + ' ago';
            if (diffHours < 24) return diffHours + ' hour' + (diffHours !== 1 ? 's' : '') + ' ago';
            return diffDays + ' day' + (diffDays !== 1 ? 's' : '') + ' ago';
        }

        function getDaysSinceSync() {
            var lastSync = OfflineStorage.getLastSyncTime();
            if (!lastSync) return null;
            var diffMs = new Date() - new Date(lastSync);
            return diffMs / 86400000;
        }

        // ===== AUTO SYNC =====

        var syncRetryCount = 0;
        var MAX_SYNC_RETRIES = 3;
        var syncRetryTimer = null;

        async function attemptSync() {
            if (syncInProgress) return;
            if (!db) {
                db = tryInitSupabase();
                if (!db) return;
            }

            var pending = OfflineStorage.getPendingMatches();
            if (pending.length === 0) {
                // Nothing to sync — still attempt purge of any stale local data
                syncRetryCount = 0;
                await attemptPurge();
                updateSyncStatus();
                return;
            }

            syncInProgress = true;
            updateSyncStatus();

            try {
                var result = await OfflineStorage.syncAllPending(db);
                console.log('Sync result:', result);

                if (result.failed > 0 && syncRetryCount < MAX_SYNC_RETRIES) {
                    // Some matches failed to sync — schedule a retry with backoff
                    syncRetryCount++;
                    var delay = Math.pow(2, syncRetryCount) * 1000; // 2s, 4s, 8s
                    console.log('Scheduling sync retry ' + syncRetryCount + ' in ' + delay + 'ms');
                    if (syncRetryTimer) clearTimeout(syncRetryTimer);
                    syncRetryTimer = setTimeout(function() {
                        if (OfflineStorage.isOnline()) {
                            attemptSync();
                        }
                    }, delay);
                } else if (result.failed === 0) {
                    syncRetryCount = 0;
                }
            } catch (err) {
                console.error('Sync error:', err);
                // Schedule retry on error
                if (syncRetryCount < MAX_SYNC_RETRIES) {
                    syncRetryCount++;
                    var delay = Math.pow(2, syncRetryCount) * 1000;
                    console.log('Scheduling sync retry ' + syncRetryCount + ' after error in ' + delay + 'ms');
                    if (syncRetryTimer) clearTimeout(syncRetryTimer);
                    syncRetryTimer = setTimeout(function() {
                        if (OfflineStorage.isOnline()) {
                            attemptSync();
                        }
                    }, delay);
                }
            }

            // After sync completes, attempt purge if everything is synced
            // Keep syncInProgress=true to prevent re-entrant sync during purge
            await attemptPurge();

            syncInProgress = false;
            updateSyncStatus();

            // Refresh the resume list in case synced+completed matches were removed
            loadLocalInProgressMatches();
        }

        // Periodically check for pending matches and sync them
        setInterval(function() {
            if (!syncInProgress && OfflineStorage.isOnline() && !isDemoMode()) {
                var pending = OfflineStorage.getPendingMatches();
                if (pending.length > 0) {
                    syncRetryCount = 0; // Reset retry count for periodic sync
                    attemptSync();
                }
            }
        }, 30000); // Check every 30 seconds

        async function attemptPurge() {
            try {
                var purgeResult = await OfflineStorage.purgeVerifiedLocalStorage(db);
                console.log('Purge result:', purgeResult);
            } catch (err) {
                console.error('Purge error:', err);
            }
        }

        // ===== STALE LOCK CLEANUP =====
        // Clean up any locks from tabs that crashed or navigated away
        OfflineStorage.clearStaleLocks();

        // ===== DEMO MODE CLEANUP =====
        // Remove all demo match data from localStorage on page load
        function cleanupDemoData() {
            var allMatches = OfflineStorage.getAllMatches();
            var matchIds = Object.keys(allMatches);
            var removed = 0;
            matchIds.forEach(function(id) {
                OfflineStorage.removeMatch(id);
                removed++;
            });
            if (removed > 0) {
                console.log('[DEMO] Cleaned up ' + removed + ' stale demo match(es)');
            }
        }

        // ===== LOAD IN-PROGRESS MATCHES FROM LOCAL STORAGE =====

        function loadLocalInProgressMatches() {
            var matches = OfflineStorage.getInProgressMatches();

            if (matches.length === 0) {
                document.getElementById('resume-match-container').style.display = 'none';
                return;
            }

            // For each match, load set data to show current score and set history
            var matchesWithSets = matches.map(function(match) {
                var sets = OfflineStorage.getSets(match.match_id);
                var currentSetNumber = 1;
                var currentSet = null;
                var setHistory = [];

                // Build set history and find the current set
                for (var i = 1; i <= 3; i++) {
                    var set = sets[i];
                    if (set) {
                        setHistory.push({
                            setNumber: i,
                            status: set.set_status,
                            team1Score: set.team1_score || 0,
                            team2Score: set.team2_score || 0
                        });
                    }
                    if (set && set.set_status === 'in_progress') {
                        currentSetNumber = i;
                        currentSet = set;
                    } else if (!set || set.set_status !== 'completed') {
                        if (!currentSet) {
                            currentSetNumber = i;
                            currentSet = set || null;
                        }
                    }
                }

                // Determine match format label
                var formatLabel = '';
                if (match.match_format === 'pool_play') {
                    if (match.scoring_format === '0_to_21') formatLabel = 'Pool Play (to 21)';
                    else if (match.scoring_format === '4_to_25') formatLabel = 'Pool Play (4-25)';
                    else formatLabel = 'Pool Play';
                } else if (match.match_format === 'bracket_play') {
                    formatLabel = 'Bracket Play';
                }

                return {
                    match_id: match.match_id,
                    team1_name: match.team1_name,
                    opponent_name: match.opponent_name,
                    created_at: match.created_at,
                    sync_status: match.sync_status,
                    currentSetNumber: currentSetNumber,
                    currentSet: currentSet,
                    setHistory: setHistory,
                    formatLabel: formatLabel
                };
            });

            displayInProgressMatches(matchesWithSets);
        }

        function displayInProgressMatches(matches) {
            var container = document.getElementById('resume-match-container');
            var listDiv = document.getElementById('resume-matches-list');

            listDiv.innerHTML = '';

            matches.forEach(function(match) {
                var matchBtn = document.createElement('button');
                matchBtn.className = 'resume-match-btn';
                matchBtn.onclick = function() {
                    resumeMatch(match.match_id);
                };

                // Format match time
                var matchDate = new Date(match.created_at);
                var timeStr = matchDate.toLocaleTimeString('en-US', {
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });

                // Build the display text
                var esc = OfflineStorage.escapeHTML;
                var displayHTML = '<div class="resume-match-teams">' + esc(match.team1_name) + ' vs. ' + esc(match.opponent_name);

                // Show sync badge if pending
                if (match.sync_status === 'pending') {
                    displayHTML += '<span class="resume-match-sync-badge pending">Local</span>';
                }

                displayHTML += '</div>';

                // Show format label
                if (match.formatLabel) {
                    displayHTML += '<div class="resume-match-format">' + match.formatLabel + '</div>';
                }

                // Show age warning for old matches
                var ageMs = Date.now() - matchDate.getTime();
                var ageDays = Math.floor(ageMs / (1000 * 60 * 60 * 24));
                if (ageDays >= 1) {
                    var ageLabel = ageDays === 1 ? '1 day ago' : ageDays + ' days ago';
                    displayHTML += '<div class="resume-match-time resume-match-stale">Started ' + ageLabel + '</div>';
                } else {
                    displayHTML += '<div class="resume-match-time">Started at ' + timeStr + '</div>';
                }

                // Show set history
                if (match.setHistory.length > 0) {
                    displayHTML += '<div class="resume-match-sets">';
                    match.setHistory.forEach(function(set) {
                        var badgeClass = set.status === 'completed' ? 'completed' : 'in-progress';
                        var label = 'Set ' + set.setNumber + ': ' + set.team1Score + '-' + set.team2Score;
                        displayHTML += '<span class="resume-set-badge ' + badgeClass + '">' + label + '</span>';
                    });
                    displayHTML += '</div>';
                }

                matchBtn.innerHTML = displayHTML;

                // Add delete button for abandoned matches (3+ days old)
                if (ageDays >= 3) {
                    var deleteBtn = document.createElement('button');
                    deleteBtn.className = 'resume-match-delete';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = function(e) {
                        e.stopPropagation();
                        deleteAbandonedMatch(match.match_id, match.opponent_name);
                    };
                    matchBtn.appendChild(deleteBtn);
                }

                listDiv.appendChild(matchBtn);
            });

            container.style.display = 'block';
        }

        // Delete an abandoned match from localStorage
        function deleteAbandonedMatch(matchId, opponentName) {
            if (!confirm('Delete abandoned match vs ' + (opponentName || 'Unknown') + '? This cannot be undone.')) {
                return;
            }
            OfflineStorage.removeMatch(matchId);
            loadLocalInProgressMatches();
        }

        // Resume a match
        function resumeMatch(matchId) {
            window.location.href = 'volleyball-tracker.html?matchId=' + encodeURIComponent(matchId);
        }

        // Navigate to Analyze Stats (requires online)
        function goToAnalyzeStats() {
            if (!OfflineStorage.isOnline()) return;
            window.location.href = 'analyze-stats.html';
        }

        // Enable/disable Analyze Stats based on connectivity
        function updateAnalyzeStatsButton() {
            var card = document.getElementById('analyze-stats-card');
            var desc = document.getElementById('analyze-stats-desc');
            if (OfflineStorage.isOnline()) {
                card.classList.remove('disabled-offline');
                desc.textContent = isDemoMode()
                    ? 'View full season statistics'
                    : 'View and analyze match statistics';
            } else {
                card.classList.add('disabled-offline');
                desc.textContent = 'Requires internet connection';
            }
        }

        // Start New Match - navigate to match setup page
        function startNewMatch() {
            window.location.href = 'match-setup.html';
        }
    </script>
</body>
</html>
